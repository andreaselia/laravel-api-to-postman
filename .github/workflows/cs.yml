name: CS

on:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        name: Code Style
        steps:
            - uses: actions/checkout@v7
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - name: Install Dependencies
              run: composer update --prefer-dist --no-interaction --no-progress
            - name: Verify
              run: vendor/bin/pint --test
